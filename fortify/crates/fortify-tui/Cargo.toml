[package]
name = "fortify-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Terminal User Interface for Fortify deployment and management"
build = "build.rs"

[[bin]]
name = "fortify"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true

# TUI framework
ratatui = "0.30"
crossterm = "0.29"

# Internal crates
fortify-core = { path = "../fortify-core" }
fortify-orchestrator = { path = "../fortify-orchestrator" }
fortify-controller = { path = "../fortify-controller" }

# HTTP client for status polling and verification
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls", "socks"] }

# Async utilities
futures = "0.3"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
base64 = "0.22"
unicode-width = "0.2"
regex = "1.10"
urlencoding = "2.1.3"
