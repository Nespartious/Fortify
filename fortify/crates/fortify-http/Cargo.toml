[package]
name = "fortify-http"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
fortify-core = { path = "../fortify-core" }
fortify-gate = { path = "../fortify-gate" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
hyper = { version = "1.8", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy"] }
http-body-util = "0.1"
http = "1.0"
bytes = "1.5"
rand = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-tls", "blocking", "json"] }
uuid = { version = "1.19.0", features = ["v4", "fast-rng"] }
lazy_static = "1.4"
