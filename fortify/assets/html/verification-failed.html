<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SERVICE_NAME}} — Verification Failed</title>
    <style>
        /* ============================================================
         * BRANDING CONFIGURATION
         * CSS variables are injected by Fortify's template engine.
         * ============================================================ */
        :root {
            /* Brand Colors (injected from config) */
            --brand-primary: {{PRIMARY_COLOR}};
            --brand-secondary: {{SECONDARY_COLOR}};
            --brand-tertiary: {{SECONDARY_COLOR}};
            
            /* Background Colors */
            --bg-deep: #141417;
            --bg-surface: #1e1e23;
            --bg-elevated: #26262d;
            
            /* Border Colors */
            --border-subtle: #3a3a42;
            --border-accent: #4a4a55;
            
            /* Text Colors */
            --text-primary: #f5f0e8;
            --text-secondary: #a8a4a0;
            --text-muted: #6b6862;
            
            /* Status Colors */
            --status-error: #e05252;
            --status-warning: #e4bc5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-deep);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .container {
            max-width: 460px;
            width: 100%;
            text-align: center;
        }
        .error-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        .brand-name {
            font-size: 0.75rem;
            color: var(--brand-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--status-error);
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            margin-bottom: 28px;
        }
        .message-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-left: 3px solid var(--status-error);
            border-radius: 0 4px 4px 0;
            padding: 20px 24px;
            margin-bottom: 24px;
            text-align: left;
        }
        .message-box p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .attempts-badge {
            display: inline-block;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 3px;
            padding: 8px 16px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }
        .attempts-badge strong {
            color: var(--status-warning);
        }
        .delay-notice {
            display: {{DELAY_DISPLAY}};
            background: color-mix(in srgb, var(--status-error) 10%, transparent);
            border: 1px solid var(--status-error);
            border-radius: 4px;
            padding: 14px 18px;
            margin-bottom: 24px;
            font-size: 0.85rem;
            color: var(--status-error);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .retry-btn {
            display: inline-block;
            background: transparent;
            color: var(--brand-primary);
            border: 1px solid var(--brand-secondary);
            border-radius: 3px;
            padding: 14px 36px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-decoration: none;
            transition: all 0.2s ease;
            opacity: 0;
            animation: fadeIn 0.5s ease-out {{DELAY_SECONDS}}s forwards;
        }
        .retry-btn:hover {
            background: var(--brand-primary);
            border-color: var(--brand-primary);
            color: var(--bg-deep);
        }
        .footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        {{CUSTOM_CSS}}
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">✗</div>
        <div class="brand-name">{{SERVICE_NAME}}</div>
        <h1>Verification Failed</h1>
        <div class="subtitle">Challenge response incorrect</div>
        
        <div class="message-box">
            <p>The code you entered was incorrect. Please try again with a new challenge.</p>
        </div>
        
        <div class="attempts-badge">
            Attempts: <strong>{{ATTEMPTS}}</strong>
        </div>
        
        <div class="delay-notice">
            Please wait before retrying...
        </div>
        
        <a href="/Fortify/Portcullis" class="retry-btn">Try Again</a>
        
        <div class="footer">
            {{FORTIFY_FOOTER_BRANDING}}
        </div>
    </div>
    {{FORTIFY_BRANDING_INJECTION_POINT}}
</body>
</html>
