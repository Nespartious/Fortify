<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortify — Citadel Gate</title>
    <style>
        :root {
            --bg-deep: #141417;
            --bg-surface: #1e1e23;
            --bg-elevated: #26262d;
            --border-subtle: #3a3a42;
            --border-accent: #4a4a55;
            --gold-primary: #c9a227;
            --gold-muted: #a68b5b;
            --gold-light: #d4b85a;
            --bronze: #8b7355;
            --text-primary: #f5f0e8;
            --text-secondary: #a8a4a0;
            --text-muted: #6b6862;
            --sage: #9ab893;
            --slate-blue: #6b7c8c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-deep);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        /* Subtle texture overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(201, 162, 39, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(139, 115, 85, 0.02) 0%, transparent 40%);
            pointer-events: none;
        }
        .emblem {
            font-size: 4rem;
            margin-bottom: 24px;
            opacity: 0.9;
            filter: drop-shadow(0 4px 12px rgba(201, 162, 39, 0.15));
        }
        h1 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 0.85rem;
            color: var(--gold-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        .message {
            max-width: 420px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 40px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .enter-btn {
            opacity: 0;
            animation: fadeIn 0.6s ease-out 1.5s forwards;
            background: transparent;
            color: var(--gold-primary);
            border: 1px solid var(--gold-muted);
            padding: 16px 48px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .enter-btn:hover {
            background: var(--gold-primary);
            border-color: var(--gold-primary);
            color: var(--bg-deep);
            box-shadow: 0 4px 20px rgba(201, 162, 39, 0.25);
        }
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            padding: 12px 24px;
            font-size: 0.7rem;
            display: flex;
            justify-content: center;
            gap: 32px;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .status-bar span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-bar span::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--sage);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="emblem">🏰</div>
    <h1>Fortify</h1>
    <p class="tagline">Citadel Defense Active</p>
    <p class="message">
        You are approaching a protected gateway. Identity verification is required to proceed beyond the outer walls.
    </p>
    <a href="/Fortify/Portcullis" class="enter-btn">Request Entry</a>
    <div class="status-bar">
        <span>System Online</span>
        <span>Protected</span>
        <span>Encrypted</span>
    </div>
</body>
</html>
