<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SERVICE_NAME}} — Entry Gate</title>
    <style>
        /* ============================================================
         * BRANDING CONFIGURATION
         * CSS variables are injected by Fortify's template engine.
         * Default values provide fallbacks if placeholders aren't replaced.
         * ============================================================ */
        :root {
            /* Brand Colors (injected from config) */
            --brand-primary: {{PRIMARY_COLOR}};
            --brand-secondary: {{SECONDARY_COLOR}};
            --brand-tertiary: {{TERTIARY_COLOR}};
            
            /* Background Colors */
            --bg-deep: #141417;
            --bg-surface: #1e1e23;
            --bg-elevated: #26262d;
            
            /* Border Colors */
            --border-subtle: #3a3a42;
            --border-accent: #4a4a55;
            
            /* Text Colors */
            --text-primary: #f5f0e8;
            --text-secondary: #a8a4a0;
            --text-muted: #6b6862;
            
            /* Status Colors */
            --status-success: #9ab893;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-deep);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        /* Subtle texture overlay using brand colors */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--brand-primary) 3%, transparent) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--brand-secondary) 2%, transparent) 0%, transparent 40%);
            pointer-events: none;
        }
        
        /* Brand Header */
        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-logo {
            max-width: 80px;
            max-height: 80px;
            margin-bottom: 16px;
        }
        .emblem {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.9;
            filter: drop-shadow(0 4px 12px color-mix(in srgb, var(--brand-primary) 15%, transparent));
        }
        .brand-name {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .brand-description {
            font-size: 0.85rem;
            color: var(--brand-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        .message {
            max-width: 420px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 40px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .enter-btn {
            opacity: 0;
            animation: fadeIn 0.6s ease-out 1.5s forwards;
            background: transparent;
            color: var(--brand-primary);
            border: 1px solid var(--brand-secondary);
            padding: 16px 48px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .enter-btn:hover {
            background: var(--brand-primary);
            border-color: var(--brand-primary);
            color: var(--bg-deep);
            box-shadow: 0 4px 20px color-mix(in srgb, var(--brand-primary) 25%, transparent);
        }
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            padding: 12px 24px;
            font-size: 0.7rem;
            display: flex;
            justify-content: center;
            gap: 32px;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .status-bar span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-bar span::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--status-success);
            border-radius: 50%;
        }
        
        /* Accessibility: Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            .enter-btn {
                animation: none;
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Brand Header -->
    <header class="brand-header">
        <div class="emblem">🏰</div>
        <h1 class="brand-name">{{SERVICE_NAME}}</h1>
        <p class="brand-description">{{DESCRIPTION}}</p>
    </header>
    
    <!-- Welcome Message -->
    <p class="message">{{WELCOME_MESSAGE}}</p>
    
    <!-- Entry Button -->
    <a href="/Fortify/Portcullis" class="enter-btn">Request Entry</a>
    
    <!-- Status Bar -->
    <footer class="status-bar">
        <span>System Online</span>
        <span>Protected</span>
        <span>Encrypted</span>
    </footer>
</body>
</html>
