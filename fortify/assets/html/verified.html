<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="{{REDIRECT_DELAY}};url=/">
    <title>{{SERVICE_NAME}} — Verified</title>
    <style>
        /* ============================================================
         * BRANDING CONFIGURATION
         * CSS variables are injected by Fortify's template engine.
         * ============================================================ */
        :root {
            /* Brand Colors (injected from config) */
            --brand-primary: {{PRIMARY_COLOR}};
            --brand-secondary: {{SECONDARY_COLOR}};
            --brand-tertiary: {{TERTIARY_COLOR}};
            
            /* Background Colors */
            --bg-deep: #141417;
            --bg-surface: #1e1e23;
            --bg-elevated: #26262d;
            
            /* Border Colors */
            --border-subtle: #3a3a42;
            --border-accent: #4a4a55;
            
            /* Text Colors */
            --text-primary: #f5f0e8;
            --text-secondary: #a8a4a0;
            --text-muted: #6b6862;
            
            /* Status Colors */
            --status-success: #9ab893;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-deep);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        /* Subtle texture overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--brand-primary) 3%, transparent) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--status-success) 3%, transparent) 0%, transparent 40%);
            pointer-events: none;
        }
        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
        }
        .success-badge {
            display: inline-block;
            background: var(--status-success);
            color: var(--bg-deep);
            padding: 6px 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border-radius: 2px;
            margin-bottom: 24px;
        }
        .icon-row {
            font-size: 3.5rem;
            margin-bottom: 16px;
            filter: drop-shadow(0 4px 12px color-mix(in srgb, var(--status-success) 20%, transparent));
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 0.75rem;
            color: var(--brand-secondary);
            letter-spacing: 0.1em;
            margin-bottom: 28px;
        }
        .message-box {
            background: var(--bg-elevated);
            border-left: 3px solid var(--status-success);
            border-radius: 0 3px 3px 0;
            padding: 20px;
            margin-bottom: 28px;
            text-align: left;
        }
        .message-box p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.7;
            margin: 0;
        }
        .message-box strong {
            color: var(--text-primary);
        }
        .status-indicators {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .indicator {
            font-size: 0.7rem;
            padding: 6px 14px;
            border: 1px solid var(--border-accent);
            border-radius: 2px;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }
        .indicator.active {
            border-color: var(--status-success);
            color: var(--status-success);
        }
        .redirect-notice {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
        }
        /* Button appears after 3 seconds using CSS animation */
        .proceed-btn {
            display: inline-block;
            background: var(--brand-primary);
            color: var(--bg-deep);
            border: none;
            border-radius: 3px;
            padding: 14px 32px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-decoration: none;
            transition: all 0.2s ease;
            opacity: 0;
            animation: fadeInButton 0.5s ease-out 3s forwards;
        }
        @keyframes fadeInButton {
            to { opacity: 1; }
        }
        .proceed-btn:hover {
            filter: brightness(1.15);
            box-shadow: 0 4px 16px color-mix(in srgb, var(--brand-primary) 30%, transparent);
        }
        .footer-text {
            margin-top: 28px;
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="success-badge">✓ Verified</div>
        <div class="icon-row">🔓</div>
        <h1>Access Granted</h1>
        <div class="tagline">Identity Confirmed</div>
        
        <div class="message-box">
            <p>Your verification is complete. You will be automatically transferred to the <strong>secure zone</strong> in a few moments.</p>
        </div>
        
        <div class="status-indicators">
            <span class="indicator active">◉ Encrypted</span>
            <span class="indicator active">◉ Verified</span>
            <span class="indicator active">◉ Secure</span>
        </div>
        
        <div class="redirect-notice">
            Preparing secure connection...
        </div>
        
        <a href="/" class="proceed-btn">Continue Now →</a>
        
        <div class="footer-text">
            {{SERVICE_NAME}} • Trust Established
        </div>
    </div>
</body>
</html>
