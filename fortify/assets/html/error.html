<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SERVICE_NAME}} — Request Failed</title>
    <style>
        /* ============================================================
         * BRANDING CONFIGURATION
         * CSS variables are injected by Fortify's template engine.
         * ============================================================ */
        :root {
            /* Brand Colors (injected from config) */
            --brand-primary: {{PRIMARY_COLOR}};
            --brand-secondary: {{SECONDARY_COLOR}};
            --brand-tertiary: {{SECONDARY_COLOR}};
            
            /* Background Colors */
            --bg-deep: #141417;
            --bg-surface: #1e1e23;
            --bg-elevated: #26262d;
            
            /* Border Colors */
            --border-subtle: #3a3a42;
            --border-accent: #4a4a55;
            
            /* Text Colors */
            --text-primary: #f5f0e8;
            --text-secondary: #a8a4a0;
            --text-muted: #6b6862;
            
            /* Status Colors */
            --status-warning: #e4bc5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-deep);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .error-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        .brand-name {
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--brand-secondary);
            margin-bottom: 8px;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--status-warning);
            margin-bottom: 6px;
        }
        .error-code {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            margin-bottom: 28px;
        }
        .error-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-left: 3px solid var(--status-warning);
            border-radius: 0 4px 4px 0;
            padding: 24px;
            margin-bottom: 28px;
            text-align: left;
        }
        .error-box p {
            margin: 0 0 16px 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .error-box p:last-child { margin-bottom: 0; }
        .error-list {
            margin: 0;
            padding-left: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.8;
        }
        .retry-btn {
            display: inline-block;
            background: transparent;
            color: var(--brand-primary);
            border: 1px solid var(--brand-secondary);
            border-radius: 3px;
            padding: 14px 36px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .retry-btn:hover {
            background: var(--brand-primary);
            border-color: var(--brand-primary);
            color: var(--bg-deep);
        }
        .mirror-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-subtle);
            text-align: left;
        }
        .mirror-section h3 {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .mirror-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .mirror-list li {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-left: 2px solid var(--brand-secondary);
            border-radius: 0 3px 3px 0;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }
        .mirror-list li:hover {
            border-left-color: var(--brand-primary);
            background: var(--bg-elevated);
        }
        .mirror-list a {
            display: block;
            padding: 12px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
        }
        .mirror-list li:hover a {
            color: var(--text-primary);
        }
        .footer-note {
            margin-top: 24px;
            font-size: 0.65rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">⚠️</div>
        <p class="brand-name">{{SERVICE_NAME}}</p>
        <h1>{{ERROR_TITLE}}</h1>
        <div class="error-code">ERROR {{ERROR_CODE}}</div>
        <div class="error-box">
            <p>{{ERROR_MESSAGE}}</p>
        </div>
        <a href="/Fortify/Portcullis" class="retry-btn">Try Again</a>
        <div class="mirror-section">
            <h3>Alternative Mirrors</h3>
            <ul class="mirror-list">
                {{MIRROR_LIST}}
            </ul>
        </div>
        <footer class="footer-note">
            {{FORTIFY_FOOTER_BRANDING}}
        </footer>
    </div>
    {{BRANDING_INJECTION}}
</body>
</html>
