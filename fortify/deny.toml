# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# The database of advisories to check against
db-path = "~/.cargo/advisory-db"
# The URL of the advisory database
url = "https://github.com/rustsec/advisory-db"
# The lint level for crates with security vulnerabilities
vulnerability = "deny"
# The lint level for unmaintained crates
unmaintained = "warn"
# The lint level for crates with unsound code
unsound = "deny"
# The lint level for crates that have been yanked
yanked = "warn"
# Ignore specific advisories (add IDs here if you need to temporarily bypass)
# RUSTSEC-2025-0134: rustls-pemfile unmaintained - comes from reqwest 0.11 via native-tls path
# Will be resolved when we upgrade to reqwest 0.12+ (requires hyper 1.x migration)
ignore = ["RUSTSEC-2025-0134"]

[licenses]
# The lint level for unlicensed crates
unlicensed = "deny"
# List of allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
# The confidence threshold for license detection
confidence-threshold = 0.8
# Specific crate license clarifications
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# The lint level for multiple versions of the same crate
multiple-versions = "warn"
# The lint level for crates that have been marked as wildcards
wildcards = "deny"
# Allow specific crates to have duplicate versions
skip = []
# Deny specific crates entirely
deny = [
    # Example: { name = "unsafe-crate", reason = "Known security issues" }
]

[sources]
# The lint level for unknown registries
unknown-registry = "deny"
# The lint level for unknown git sources
unknown-git = "warn"
# Allow only crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow specific git sources
allow-git = []
