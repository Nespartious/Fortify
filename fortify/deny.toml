# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# The database of advisories to check against
db-path = "~/.cargo/advisory-db"
# The URL of the advisory database
db-urls = ["https://github.com/rustsec/advisory-db"]
# NOTE: vulnerability, unsound, notice, severity-threshold are REMOVED in cargo-deny v2
# All vulnerability/unsound advisories now always emit errors - use ignore list instead
# The lint level for unmaintained crates: all, workspace, transitive, none
unmaintained = "none"
# The lint level for crates that have been yanked: deny, warn, allow
yanked = "warn"
# Ignore specific advisories (add IDs here if you need to temporarily bypass)
ignore = []
# Warn about unused ignores instead of failing
unused-ignored-advisory = "allow"

[licenses]
# List of allowed licenses (unlicensed crates are denied by default)
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",  # webpki-roots certificate data
]
# The confidence threshold for license detection
confidence-threshold = 0.8
# Specific crate license clarifications
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# The lint level for multiple versions of the same crate
multiple-versions = "warn"
# The lint level for crates that have been marked as wildcards
# Allow wildcards for workspace path dependencies
wildcards = "allow"
# Allow specific crates to have duplicate versions
skip = []
# Deny specific crates entirely
deny = [
    # Example: { name = "unsafe-crate", reason = "Known security issues" }
]

[sources]
# The lint level for unknown registries
unknown-registry = "deny"
# The lint level for unknown git sources
unknown-git = "warn"
# Allow only crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow specific git sources
allow-git = []
