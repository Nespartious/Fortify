name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  #############################################################################
  # BUILD RELEASE BINARIES
  #############################################################################
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build release binaries
        working-directory: ./fortify
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package binaries
        working-directory: ./fortify
        run: |
          mkdir -p dist
          
          for bin in fortify fortify-controller fortify-orchestrator fortify-gate fortify-http fortify-node; do
            if [ -f "target/${{ matrix.target }}/release/$bin" ]; then
              cp "target/${{ matrix.target }}/release/$bin" dist/
            fi
          done
          
          # Copy assets and config
          cp -r assets dist/ 2>/dev/null || true
          cp -r config dist/ 2>/dev/null || true
          cp ../deploy.sh dist/ 2>/dev/null || true
          cp ../README.md dist/ 2>/dev/null || true
          
          # Create tarball
          cd dist
          tar -czvf ../fortify-${{ matrix.name }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fortify-${{ matrix.name }}
          path: fortify/fortify-${{ matrix.name }}.tar.gz

  #############################################################################
  # CREATE GITHUB RELEASE
  #############################################################################
  release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -name "*.tar.gz" -exec mv {} . \;
          sha256sum *.tar.gz > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Fortify ${{ steps.version.outputs.version }}
          body: |
            ## Fortify ${{ steps.version.outputs.version }}
            
            ### Installation
            
            #### Quick Install (Ubuntu)
            ```bash
            # Download and extract
            wget https://github.com/Nespartious/Fortify/releases/download/${{ steps.version.outputs.version }}/fortify-linux-x86_64.tar.gz
            tar -xzf fortify-linux-x86_64.tar.gz
            
            # Run the TUI
            ./fortify
            ```
            
            #### Scripted Deployment
            ```bash
            # Edit configuration
            nano deploy.sh
            
            # Run deployment
            sudo ./deploy.sh
            ```
            
            ### Checksums
            See `checksums-sha256.txt` for SHA256 checksums of all binaries.
            
            ### What's Changed
            See [CHANGELOG.md](https://github.com/Nespartious/Fortify/blob/main/CHANGELOG.md) for details.
          files: |
            artifacts/*.tar.gz
            artifacts/checksums-sha256.txt
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
