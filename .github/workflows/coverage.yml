name: Test Coverage

# Automatic triggers on push and PR to main
on:
  push:
    branches: [main]
    paths:
      - 'fortify/**'
      - 'Cargo.toml'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fortify/**'
      - 'Cargo.toml'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run coverage analysis'
        required: false
        default: true
        type: boolean

# Runner selection: Prefers self-hosted, falls back to GitHub-hosted
env:
  CARGO_TERM_COLOR: always

jobs:
  #############################################################################
  # CODE COVERAGE WITH TARPAULIN
  #############################################################################
  coverage:
    name: Code Coverage
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run tests with coverage
        working-directory: ./fortify
        run: |
          cargo tarpaulin --out Xml --out Html --output-dir coverage \
            --skip-clean --timeout 300 \
            --ignore-tests --ignore-panics \
            || true  # Don't fail if coverage is low

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./fortify/coverage/cobertura.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: fortify/coverage/
        if: always()

      - name: Generate coverage summary
        working-directory: ./fortify
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "coverage/tarpaulin-report.html" ]; then
            # Extract coverage percentage if possible
            coverage=$(grep -oP 'Coverage: \K[0-9.]+' coverage/tarpaulin-report.html 2>/dev/null | head -1 || echo "N/A")
            echo "**Overall Coverage**: ${coverage}%" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_Full report available in artifacts_" >> $GITHUB_STEP_SUMMARY
          else
            echo "_Coverage report not generated. This may be due to compilation issues or no tests._" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Check coverage threshold
        working-directory: ./fortify
        run: |
          THRESHOLD=50
          
          if [ -f "coverage/cobertura.xml" ]; then
            # Extract line coverage from Cobertura XML
            COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage/cobertura.xml | head -1 || echo "0")
            # Convert from decimal (0.XX) to percentage
            COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc | cut -d'.' -f1)
            
            echo "📊 Current coverage: ${COVERAGE_PCT}%"
            echo "📊 Threshold: ${THRESHOLD}%"
            
            if [ "$COVERAGE_PCT" -lt "$THRESHOLD" ]; then
              echo "❌ Coverage ${COVERAGE_PCT}% is below threshold ${THRESHOLD}%"
              echo "::warning::Coverage is below ${THRESHOLD}% threshold"
              # Warn but don't fail for now - uncomment to enforce
              # exit 1
            else
              echo "✅ Coverage ${COVERAGE_PCT}% meets threshold ${THRESHOLD}%"
            fi
          else
            echo "⚠️ Coverage file not found - skipping threshold check"
          fi

  #############################################################################
  # TEST SUMMARY
  #############################################################################
  test-summary:
    name: Test Summary
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Run tests with output
        working-directory: ./fortify
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo test --all-targets 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Count tests
        working-directory: ./fortify
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Statistics" >> $GITHUB_STEP_SUMMARY
          
          # Count test functions
          test_count=$(grep -r "#\[test\]" --include="*.rs" | wc -l)
          echo "- **Unit tests**: $test_count" >> $GITHUB_STEP_SUMMARY
          
          # Count integration tests
          integration_count=$(find tests -name "*.rs" 2>/dev/null | wc -l)
          echo "- **Integration test files**: $integration_count" >> $GITHUB_STEP_SUMMARY
