name: CI

# Manual trigger only - use GitHub Actions UI or gh workflow run
on:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all jobs'
        required: false
        default: true
        type: boolean

# To re-enable automatic triggers, uncomment below:
# on:
#   push:
#     branches: [main, develop]
#   pull_request:
#     branches: [main, develop]

# Runner selection: Prefers self-hosted, falls back to GitHub-hosted
# To use self-hosted: Add a runner with labels [self-hosted, linux, fortify]
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # Set to 'true' to force GitHub-hosted runners
  USE_GITHUB_HOSTED: 'false'

jobs:
  #############################################################################
  # BUILD & TEST
  #############################################################################
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Self-hosted runners: use labels [self-hosted, linux, fortify]
        # Falls back to GitHub-hosted if self-hosted unavailable
        runner: 
          - ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
          - ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build (debug)
        working-directory: ./fortify
        run: cargo build --all-targets

      - name: Build (release)
        working-directory: ./fortify
        run: cargo build --release

      - name: Run tests
        working-directory: ./fortify
        run: cargo test --all-targets

  #############################################################################
  # CODE FORMATTING
  #############################################################################
  fmt:
    name: Code Formatting
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: ./fortify
        run: cargo fmt --all -- --check

  #############################################################################
  # LINTING (CLIPPY)
  #############################################################################
  clippy:
    name: Clippy Lints
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Run Clippy (all targets)
        working-directory: ./fortify
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::all \
            -D clippy::pedantic \
            -A clippy::module_name_repetitions \
            -A clippy::too_many_lines \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::doc_markdown

  #############################################################################
  # DOCUMENTATION
  #############################################################################
  docs:
    name: Documentation
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Check documentation
        working-directory: ./fortify
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  #############################################################################
  # MINIMUM SUPPORTED RUST VERSION
  #############################################################################
  msrv:
    name: Minimum Rust Version (1.75)
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Check MSRV compatibility
        working-directory: ./fortify
        run: cargo check --all-targets
