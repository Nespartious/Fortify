name: CI

# Automatic triggers on push and PR to main branches
on:
  push:
    branches: [main, develop]
    paths:
      - 'fortify/**'
      - 'Cargo.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'fortify/**'
      - 'Cargo.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all jobs'
        required: false
        default: true
        type: boolean

# Runner selection: Prefers self-hosted, falls back to GitHub-hosted
# To use self-hosted: Add a runner with labels [self-hosted, linux, fortify]
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # Set to 'true' to force GitHub-hosted runners
  USE_GITHUB_HOSTED: 'false'

jobs:
  #############################################################################
  # BUILD & TEST
  #############################################################################
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Self-hosted runners: use labels [self-hosted, linux, fortify]
        # Falls back to GitHub-hosted if self-hosted unavailable
        runner: 
          - ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
          - ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build (debug)
        working-directory: ./fortify
        run: cargo build --all-targets

      - name: Build (release)
        working-directory: ./fortify
        run: cargo build --release

      - name: Run tests
        working-directory: ./fortify
        run: cargo test --all-targets

  #############################################################################
  # CODE FORMATTING
  #############################################################################
  fmt:
    name: Code Formatting
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: ./fortify
        run: cargo fmt --all -- --check

  #############################################################################
  # LINTING (CLIPPY)
  #############################################################################
  clippy:
    name: Clippy Lints
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Run Clippy (all targets)
        working-directory: ./fortify
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::all \
            -D clippy::pedantic \
            -A clippy::module_name_repetitions \
            -A clippy::too_many_lines \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::doc_markdown \
            -A clippy::uninlined_format_args \
            -A clippy::unused_async \
            -A clippy::needless_pass_by_value \
            -A clippy::unused_self \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_sign_loss \
            -A clippy::cast_precision_loss \
            -A clippy::cast_possible_wrap \
            -A clippy::redundant_closure_for_method_calls \
            -A clippy::items_after_statements \
            -A clippy::single_match_else \
            -A clippy::match_same_arms \
            -A clippy::if_not_else \
            -A clippy::match_wildcard_for_single_variants \
            -A clippy::similar_names \
            -A clippy::field_reassign_with_default \
            -A clippy::map_unwrap_or \
            -A clippy::option_if_let_else \
            -A clippy::single_char_pattern \
            -A clippy::return_self_not_must_use \
            -A clippy::explicit_iter_loop \
            -A clippy::redundant_else \
            -A clippy::unnecessary_wraps \
            -A clippy::struct_excessive_bools \
            -A clippy::wildcard_imports \
            -A clippy::case_sensitive_file_extension_comparisons \
            -A clippy::clone_on_ref_ptr \
            -A clippy::cast_lossless \
            -A clippy::needless_continue \
            -A clippy::manual_let_else \
            -A clippy::format_collect \
            -A clippy::format_push_string \
            -A clippy::match_bool \
            -A clippy::assigning_clones \
            -A clippy::many_single_char_names \
            -A clippy::ignored_unit_patterns \
            -A clippy::non_std_lazy_statics \
            -A clippy::unnecessary_join \
            -A clippy::float_cmp \
            -A clippy::needless_raw_string_hashes \
            -A clippy::used_underscore_binding \
            -A clippy::unchecked_time_subtraction \
            -A clippy::items_after_test_module \
            -A clippy::semicolon_if_nothing_returned \
            -A clippy::unreadable_literal \
            -A clippy::comparison_chain \
            -A clippy::trivially_copy_pass_by_ref \
            -A clippy::unnested_or_patterns \
            -A clippy::ref_option \
            -A clippy::implicit_clone

  #############################################################################
  # DOCUMENTATION
  #############################################################################
  docs:
    name: Documentation
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Check documentation
        working-directory: ./fortify
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  #############################################################################
  # MINIMUM SUPPORTED RUST VERSION
  # Note: MSRV 1.88 required for darling 0.23 (used by ratatui 0.30)
  #############################################################################
  msrv:
    name: Minimum Rust Version (1.88)
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.100

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Check MSRV compatibility
        working-directory: ./fortify
        run: cargo check --all-targets
